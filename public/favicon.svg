<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>
  <!-- Rounded container representing the LD icon matching the website header -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#logo-grad)" />
  <!-- Bold LD text with heavy visual weight -->
  <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">LD</text>
  <!-- Beautiful glowing accent dot -->
  <circle cx="38" cy="10" r="3.5" fill="#F472B6" />
  <circle cx="38" cy="10" r="1.5" fill="#FFFFFF" />
</svg>
