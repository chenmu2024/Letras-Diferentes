name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/tatuagem/index.html
          test -f dist/grafite/index.html
          test -f dist/ff-nicks/index.html
          test -f dist/termo-helper/index.html
          test -f dist/stop-respostas/index.html
